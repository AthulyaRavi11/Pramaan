    survey_number: '(?:Survey|Khasra|Gat) No\.?\s*[:\-]\s*([A-Z0-9/\-, ]+)'
    land_area_acres: '(?:Total Area|Extent of Land)\s*[:\-]\s*([0-9.]+)\s*(?:Acres|Ac\.?)'
    registration_no: '(?:Document|Deed|Registration) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    issue_date: '(?:Date of Registration|Execution Date)\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
