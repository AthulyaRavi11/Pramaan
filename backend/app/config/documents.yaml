    proposed_name: '(?:Proposed|New) Name\s*[:\-]\s*(.+)'
    issue_date: '(?:Date of (?:Meeting|Resolution))\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
