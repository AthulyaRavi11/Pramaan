  keywords: [national board of accreditation, nba, accredited, accreditation]
  fields:
    institution_name: '(?:Name of (?:the )?Institution)\s*[:\-]\s*(.+)'
    certificate_no: '(?:Accreditation|Reference) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    programme: 'Programme\s*[:\-]\s*(.+)'
    valid_until: 'Valid (?:up ?to|Until|Till)\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
  required_fields: [institution_name, certificate_no, valid_until]
  date_fields: [valid_until]
  expiry_field: valid_until
  source: nba_registry

university_affiliation:
