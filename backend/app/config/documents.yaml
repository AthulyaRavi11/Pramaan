# Document types the platform understands.
# Each type defines: classification keywords, extraction patterns, validity field
# and which issuing-authority source (sources.yaml) can verify it.
# reference_field: which extracted field is the number the issuing authority knows the document by
#   (default certificate_no).
# Patterns are label-based regexes applied to OCR/PDF text. Add or tune them here — no code change needed.

affidavit:
  label: Affidavit / Undertaking
  keywords: [affidavit, undertaking, solemnly affirm, notary, deponent]
  fields:
    institution_name: '(?:(?:Name of (?:th[eo] )?(?:Institution|College|Institute|Premises)|Institution Name)\s*[:\-]?\s*|Director,?\s*)([A-Za-z0-9 &.,\-]+)'
    aicte_permanent_id: '(?:\bAICTE\s*)?Permanent ID\s*[:\-]\s*([0-9]-[0-9]{6,12})'
    academic_year: 'Academic Year\s*[:\-]\s*(20\d\d-\d\d)'
    issue_date: '(?:Date of Affirmation|Affirmed on|Date of|Date)\s*[:\-]\s*([0-9]{1,2}(?:[\-/.][0-9]{1,2}[\-/.][0-9]{4}|\s+[A-Za-z]+\s+[0-9]{4}))'
    notary_reg_no: 'Notary Reg(?:istration)?\.? No\.?\s*[:\-]\s*([A-Z]{2}/NOT/\d{3,6})'
  required_fields: [institution_name, aicte_permanent_id, academic_year, issue_date, notary_reg_no]
  date_fields: [issue_date]
  source: null

fire_noc:
  label: Fire Safety NOC
  keywords: [fire, no objection certificate, fire safety, fire and emergency, fire service]
  fields:
    institution_name: '(?:Name of (?:the )?(?:Institution|Premises|Occupier))\s*[:\-]\s*(.+)'
    certificate_no: '(?:NOC|Certificate) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    issue_date: 'Date of Issue\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
    valid_until: 'Valid (?:up ?to|Until|Till)\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
    built_up_area_sqm: 'Built[\- ]up Area(?: \(sq\.? ?m\))?\s*[:\-]\s*([0-9,./ ]+)'
  required_fields: [institution_name, certificate_no, issue_date, valid_until]
  date_fields: [issue_date, valid_until]
  expiry_field: valid_until
  source: state_fire_services

building_completion:
  label: Building Completion / Occupancy Certificate
  keywords: [completion certificate, occupancy, building plan, municipal, sanctioned plan]
  fields:
    institution_name: '(?:Name of (?:the )?(?:Owner|Institution|Applicant))\s*[:\-]\s*(.+)'
    certificate_no: '(?:Certificate|Permit) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    issue_date: 'Date of Issue\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
    built_up_area_sqm: 'Built[\- ]up Area(?: \(sq\.? ?m\))?\s*[:\-]\s*([0-9,./ ]+)'
  required_fields: [institution_name, certificate_no, issue_date, built_up_area_sqm]
  date_fields: [issue_date]
  source: municipal_records

floor_plan:
  label: Sanctioned Building Plan / Blueprint
  keywords: [sanctioned plan, building blueprint, architectural layout, floor plan, municipal approval, sanctioned area]
  fields:
    institution_name: '(?:Name of (?:the )?(?:Institution|College|Premises))\s*[:\-]\s*(.+)'
    certificate_no: '(?:Sanction|Approval|Plan) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    sanctioned_area_sqm: '(?:Sanctioned Built[\- ]up Area|Total Built[\- ]up Area|Sanctioned Area)(?: \(sq\.? ?m\))?\s*[:\-]\s*([0-9,./ ]+)'
    issue_date: 'Date of Sanction\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
  required_fields: [certificate_no, sanctioned_area_sqm]
  date_fields: [issue_date]
  source: municipal_records

pollution_noc:
  label: Pollution Control Board Consent
  keywords: [pollution control, consent to operate, environment, effluent]
  fields:
    institution_name: '(?:Name of (?:the )?(?:Unit|Institution))\s*[:\-]\s*(.+)'
    certificate_no: '(?:Consent|Order) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    issue_date: 'Date of Issue\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
    valid_until: 'Valid (?:up ?to|Until|Till)\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
  required_fields: [institution_name, certificate_no, valid_until]
  date_fields: [issue_date, valid_until]
  expiry_field: valid_until
  source: state_pollution_board

