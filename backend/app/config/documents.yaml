    survey_number: '(?:Survey|Khasra) No\.?\s*[:\-]\s*([A-Z0-9/\-, ]+)'
    land_category: '(?:Zoning|Land Category|Classification)\s*[:\-]\s*([A-Za-z\- ]+)'
    certificate_no: '(?:NOC|Approval|Order) No\.?\s*[:\-]\s*([A-Z0-9/\-]+)'
    issue_date: 'Date of Issue\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
