  keywords: [payment receipt, transaction, processing fee, amount paid]
  fields:
    institution_name: '(?:Name of (?:the )?Institution|Payer)\s*[:\-]\s*(.+)'
    transaction_id: 'Transaction (?:ID|Ref\.?)\s*[:\-]\s*([A-Z0-9]+)'
    aicte_permanent_id: 'AICTE Permanent ID\s*[:\-]\s*([0-9]-[0-9]{6,12})'
    payment_date: 'Payment Date\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
  required_fields: [transaction_id, aicte_permanent_id]
  date_fields: [payment_date]
