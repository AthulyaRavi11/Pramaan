balance_sheet:
  label: Audited Balance Sheet & Financial Viability
  keywords: [balance sheet, chartered accountant, audited financial, income and expenditure, net worth, udin]
  fields:
    institution_name: '(?:Name of (?:the )?(?:Entity|Trust|Society|Institution))\s*[:\-]\s*(.+)'
    financial_year: '(?:Financial|Accounting) Year\s*[:\-]\s*(20\d\d-\d\d)'
    ca_reg_no: '(?:Membership|CA Reg(?:istration)?\.?) No\.?\s*[:\-]\s*([0-9]{5,8})'
    udin: 'UDIN\s*[:\-]\s*([0-9A-Z]{18})'
    net_worth_inr: '(?:Net Worth|Reserve Fund)\s*[:\-]\s*(?:Rs\.?|INR)?\s*([0-9,]+)'
