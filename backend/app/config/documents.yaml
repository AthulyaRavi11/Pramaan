  label: State Government NOC
  keywords: [government of, no objection, state government, department of technical education, higher education department]
  fields:
    institution_name: '(?:Name of (?:the )?(?:Institution|College|Society))\s*[:\-]\s*(.+)'
    certificate_no: '(?:G\.?O\.?|Order|Letter) No\.?\s*[:\-]\s*([A-Z0-9/\-.()]+)'
    issue_date: '(?:Dated|Date of Issue)\s*[:\-]\s*([0-9]{1,2}[\-/.][0-9]{1,2}[\-/.][0-9]{4})'
  required_fields: [institution_name, certificate_no, issue_date]
  date_fields: [issue_date]
  source: null

trust_resolution:
